name: Apply editorial review

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: 3d-seg-review
  cancel-in-progress: false

jobs:
  apply:
    # Only the repository owner can change review state.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply the review request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/apply_issue_review.py
      - name: Commit the editorial change
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/editorial.json
          if git diff --cached --quiet; then
            echo "no editorial change"
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "review: apply issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
  build:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install PDF reader
        run: python -m pip install -r requirements.txt
      - name: Check GitHub Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Build using the public field allowlist
        env:
          ATLAS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
